#
# Historical note: <strings.h> is not defined by ISO C.  In XPG or POSIX
# environments, interfaces are exposed according to the edition specified.
# In a strict ISO C environment, explicitly including this non-ISO header
# is treated as a request for the interfaces it provides, so the STDC
# environments are included below as well.
#

#
# Definitions found in strings.h
#

#
# Types.
#
type |	size_t		| strings.h | ALL
type |	locale_t	| strings.h | -ALL +STDC +SUSv4+

#
# Values.
#

#
# Functions.
#

# XPG4v2 and SUSv1 introduced these interfaces in <strings.h>.
func |	ffs								|\
	int								|\
	int								|\
	strings.h | -ALL +STDC +SUSv1+

func |	strcasecmp							|\
	int								|\
	const char *; const char *					|\
	strings.h | -ALL +STDC +SUSv1+

func |	strncasecmp							|\
	int								|\
	const char *; const char *; size_t				|\
	strings.h | -ALL +STDC +SUSv1+

# POSIX.1-2008 and SUSv4 added the locale-specific interfaces.
func |	strcasecmp_l							|\
	int								|\
	const char *; const char *; locale_t				|\
	strings.h | -ALL +STDC +SUSv4+

func |	strncasecmp_l							|\
	int								|\
	const char *; const char *; size_t; locale_t			|\
	strings.h | -ALL +STDC +SUSv4+

# POSIX.1-2024 added these interfaces to the XSI option (XPG8).
func |	ffsl								|\
	int								|\
	long								|\
	strings.h | -ALL +STDC +SUSv5+

func |	ffsll								|\
	int								|\
	long long							|\
	strings.h | -ALL +STDC +SUSv5+
